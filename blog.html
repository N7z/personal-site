<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>blog - paulo</title>
    <link href="css/style.css" rel="stylesheet" />
    <link rel="icon" type="image/gif" href="./img/laptop.gif" />
  </head>
  <body>
    <div class="container">
      <div class="top-bar">
        <img src="./img/PAULO.gif" alt="banner do portal web" />
      </div>

      <ul class="navbar">
        <li>
          <a class="link" href="index.html">
            <img class="nav-icon" src="./img/icons/building16.gif" alt="computer" />
            Index
          </a>
        </li>
        <li>
          <a class="link" href="projects.html">
            <img class="nav-icon" src="./img/icons/disc7.gif" alt="disc" />
            Projects
          </a>
        </li>
        <li>
          <a class="link" href="setup.html">
            <img class="nav-icon" src="./img/icons/laptop.gif" alt="laptop" />
            Setup
          </a>
        </li>
        <li>
          <a class="link active" href="blog.html">
            <img class="nav-icon" src="./img/icons/merry7.gif" alt="merry" />
            > Blog <
          </a>
        </li>
        <li>
          <a class="link" href="about_me.html">
            <img class="nav-icon" src="./img/icons/book.gif" alt="book" />
            About Me
          </a>
        </li>
      </ul>

      <hr />

      <div class="content">
        <section>
          <p class="center">
            <img class="construction" src="./img/construction.gif" alt="under construction" />
          </p>
        </section>

        <aside class="sidebar">
          <p class="subtitle">Visitors</p>

          <a href="https://www.hitwebcounter.com/split-pdf" target="_blank" rel="noopener" title="Split PDF File Tool">
            <img
              src="https://www.hitwebcounter.com/counter/counter.php?page=21513551&amp;style=0010&amp;nbdigits=5&amp;type=page"
              alt="Split PDF File Tool"
              decoding="async"
              style="border: 0; max-width: 100%; height: auto"
            />
          </a>
          <br />

          <p class="subtitle">Playing now</p>

          <div class="now-playing" id="now-playing">
            <img id="np-cover" src="" alt="album cover" hidden />
            <p id="np-track">loading..</p>
            <p id="np-artist"></p>
          </div>

          <div class="badges">
            <img src="./img/badges/linuxarch.png" alt="arch linux badge" />
            <img src="./img/badges/phprendered.gif" alt="php badge" />
            <img src="./img/badges/anime.gif" alt="anime badge" />
            <img src="./img/badges/badgevirgo.gif" alt="virgo badge" />
            <img src="./img/badges/flagbrasil.gif" alt="brasil badge" />
          </div>
        </aside>
      </div>

      <footer>
        <div class="buttons">
          <a href="https://neocities.org/" target="_blank" rel="noreferrer">
            <img src="./img/buttons/neocities.gif" alt="neocities button" />
          </a>
          <a href="https://www.mozilla.org/firefox/" target="_blank" rel="noreferrer">
            <img src="./img/buttons/1firefox3.gif" alt="firefox button" />
          </a>
          <a href="https://validator.w3.org/" target="_blank" rel="noreferrer">
            <img src="./img/buttons/1html.gif" alt="html button" />
          </a>
        </div>

        <p class="center">paulo &copy; 2008 - All rights reserved.</p>
      </footer>
    </div>

    <script>
      fetch("https://www.ballix.net/whatsplaying/now?user=zPaulinBRz")
        .then((res) => res.json())
        .then((track) => {
          const cover = document.getElementById("np-cover");
          cover.src = track.image.large;
          cover.hidden = false;
          document.getElementById("np-track").innerHTML = `<a class="link" href="${track.url}">${track.name}</a>`;
          document.getElementById("np-artist").textContent = track.artist;
        })
        .catch(() => {
          document.getElementById("np-track").textContent = "nothing playing";
        });
    </script>
  </body>
</html>
